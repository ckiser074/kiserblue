---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bishop
# description will be included in the image's metadata
description: Bishop desktop image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/aurora-dx
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Create /var/lib/alternatives before package installs, then apply
  - type: script
    scripts:
      - 00-prepare.sh
      - 10-install-winboat.sh

  - type: dnf
    tsflags: noscripts
    install:
      packages:
        - bat
        - btrfs-assistant
        - btrfs-progs
        - duf
        - fd-find
        - iftop
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - micro
        - pwgen
        - qemu-kvm
        - ripgrep
        - snapper
        - syncthing
        - tldr
        - virt-install
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - rsync
        - rclone
        - samba
        - nmap
        - samba-winbind
        - samba-winexe
        - wsdd
        - https://github.com/AprilNEA/OpenLogi/releases/download/v0.8.11/openlogi-v0.8.11-linux-amd64.rpm
    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        install:
          - com.google.Chrome
          - com.rustdesk.RustDesk
          - com.vivaldi.Vivaldi
          - com.github.tchx84.Flatseal
          - org.qbittorrent.qBittorrent
          - com.usebottles.bottles
          - org.audacityteam.Audacity
          - org.musicbrainz.Picard

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
        - Ubuntu
        - CascadiaCode
        - CascadiaMono
      google-fonts:
        - Roboto
        - "Open Sans"
        - Inter
        - NunitoSans
        - Exo
        - Overpass
        - PublicSans
        - Lato
        - Figtree
        - RobotoSlab
        - Barlow
        - BebasNeue
        - Jost
